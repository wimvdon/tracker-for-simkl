name: Release

# Push a tag like v1.2.0 to build the APK and publish it as a GitHub Release.
# "Run workflow" on the Actions tab with "Release" set to patch, minor or major
# picks the next version after the latest v* tag, builds the APK and publishes
# that release (creating the tag). With "Release" left at none, on a pull request
# or on a push to main, it only builds (and tests) a downloadable artifact.
# There is no release key yet: the release APK is signed with the runner's debug key,
# so uninstall the previous version before installing a new one.
# Optional repository secret SIMKL_CLIENT_ID bakes a default SIMKL client ID into the APK.
on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      bump:
        description: Release (none = only build, patch = 1.0.0 -> 1.0.1, minor = 1.0.0 -> 1.1.0, major = 1.0.0 -> 2.0.0)
        type: choice
        options: [none, patch, minor, major]
        default: none

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      code: ${{ steps.v.outputs.code }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: v
        shell: bash
        env:
          BUMP: ${{ inputs.bump || 'none' }}
        run: |
          publish=false
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            name="${GITHUB_REF_NAME#v}"
            publish=true
          elif [[ "$BUMP" != "none" ]]; then
            latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
            IFS=. read -r major minor patch <<< "${latest#v}"
            major=${major:-0}; minor=${minor:-0}; patch=${patch:-0}
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
            name="$major.$minor.$patch"
            if git rev-parse -q --verify "refs/tags/v$name" >/dev/null; then
              echo "::error::Tag v$name already exists"
              exit 1
            fi
            echo "Latest tag ${latest:-none}, releasing v$name"
            publish=true
          else
            name="1.0.0"
          fi
          if [[ ! "$name" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag must look like v1.2.3, got '$GITHUB_REF_NAME'"
            exit 1
          fi
          code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Build APK
        env:
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
        run: |
          ./gradlew assembleRelease \
            -PversionName=${{ needs.version.outputs.name }} \
            -PversionCode=${{ needs.version.outputs.code }}
          cp app/build/outputs/apk/release/app-release.apk \
            "$RUNNER_TEMP/simklr-${{ needs.version.outputs.name }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ${{ runner.temp }}/simklr-*.apk
          if-no-files-found: error

  release:
    if: needs.version.outputs.publish == 'true'
    needs: [version, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: SIMKLr ${{ needs.version.outputs.name }}
          files: dist/*
          generate_release_notes: true
