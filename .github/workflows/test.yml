name: Launch test

# Runs the unit tests, including LaunchTest, which starts MainActivity under Robolectric
# (no emulator) so start-up crashes fail with their full stack trace in the log, and uploads
# the debug APK of the commit.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Unit and launch tests
        run: ./gradlew testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Check R8 keeps reflection entry points in the release build
        run: |
          ./gradlew assembleRelease
          seeds=app/build/outputs/r8-seeds.txt
          test -s "$seeds" || { echo "::error::R8 seeds file missing"; exit 1; }
          for entry in "androidx.work.impl.WorkDatabase_Impl: WorkDatabase_Impl()" \
                       "io.github.impca201.simklr.work.NewEpisodesWorker: NewEpisodesWorker(android.content.Context,androidx.work.WorkerParameters)"; do
            grep -qF "$entry" "$seeds" || { echo "::error::R8 did not keep $entry"; grep -F "WorkDatabase_Impl" "$seeds" | head; exit 1; }
          done
          echo "Release build keeps the WorkManager/Room constructors."
      - uses: actions/upload-artifact@v4
        with:
          name: simklr-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/
