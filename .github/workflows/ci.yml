name: CI

# Unit tests (including LaunchTest, which starts MainActivity under Robolectric, so start-up
# crashes fail with their full stack trace), the debug APK of the commit, and a release build
# that checks R8 keeps the reflection entry points. Runs once per pull request push, and on main
# after a merge.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          # Tags, so the debug build is versioned from the latest release (git describe).
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Unit and launch tests
        run: ./gradlew testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew assembleDebug -PsimklClientId="${{ vars.SIMKL_CLIENT_ID }}"
      - name: Check R8 keeps reflection entry points in the release build
        run: |
          ./gradlew assembleRelease -PsimklClientId="${{ vars.SIMKL_CLIENT_ID }}"
          seeds=$(find app/build build -name '*seeds*.txt' -size +0 2>/dev/null | head -n1)
          test -n "$seeds" || { echo "::error::R8 seeds file missing"; find . -name '*seeds*' | head; exit 1; }
          echo "Seeds: $seeds"
          for entry in "androidx.work.impl.WorkDatabase_Impl: WorkDatabase_Impl()" \
                       "io.github.impca201.trackerforsimkl.work.NewEpisodesWorker: NewEpisodesWorker(android.content.Context,androidx.work.WorkerParameters)"; do
            grep -qF "$entry" "$seeds" || { echo "::error::R8 did not keep $entry"; grep -F "WorkDatabase_Impl" "$seeds" | head; exit 1; }
          done
          echo "Release build keeps the WorkManager/Room constructors."
      - uses: actions/upload-artifact@v7
        with:
          name: tracker-for-simkl-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/
