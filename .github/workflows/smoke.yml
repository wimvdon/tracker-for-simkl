name: Smoke test

# Installs the debug APK on an emulator, opens the app and fails when it crashes.
# The crash log, the full logcat and a screenshot are uploaded as the "smoke" artifact.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Build debug APK
        run: ./gradlew assembleDebug && ./gradlew --stop
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          disk-size: 2048M
          ram-size: 2048M
          script: |
            mkdir -p smoke
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n io.github.impca201.simklr/.ui.MainActivity
            sleep 20
            adb exec-out screencap -p > smoke/screen.png
            adb logcat -d -b crash > smoke/crash.txt || true
            adb logcat -d > smoke/logcat.txt || true
            echo "----- crash buffer -----"; cat smoke/crash.txt
            grep -E "FATAL EXCEPTION|AndroidRuntime" -A 40 smoke/logcat.txt | head -120 || true
            test ! -s smoke/crash.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke
          path: smoke/
